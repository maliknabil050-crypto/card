<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فهد الزهراني | البطاقة الرقمية</title>
  <style>
    :root {
      --bg: #120F0D;
      --card-bg: rgba(26, 20, 18, 0.75);
      --card-border: rgba(217, 119, 6, 0.4);
      --accent: #D97706;
      --accent-light: #FBBF24;
      --text: #F9FAFB;
      --muted: #9CA3AF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at top, #382414 0%, var(--bg) 75%),
        radial-gradient(circle at 80% 20%, rgba(217, 119, 6, 0.08) 0%, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
    }

    /* حاوية الكارت مع الحواف الزجاجية اللامعة والمتحركة */
    .card-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid var(--card-border);
      border-radius: 28px;
      padding: 32px 22px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85),
                  0 0 30px rgba(217, 119, 6, 0.2);
      position: relative;
      overflow: hidden;
    }

    /* تأثير اللمعان المتحرك على الحواف */
    .card-container::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, transparent, rgba(251, 191, 36, 0.6), transparent, rgba(217, 119, 6, 0.6), transparent);
      border-radius: 30px;
      z-index: -1;
      animation: borderGlow 4s linear infinite;
    }

    @keyframes borderGlow {
      0% { opacity: 0.4; filter: hue-rotate(0deg); }
      50% { opacity: 0.9; filter: hue-rotate(15deg); }
      100% { opacity: 0.4; filter: hue-rotate(0deg); }
    }

    .avatar-container {
      width: 85px;
      height: 85px;
      margin: 0 auto 14px auto;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background-color: #1E1815;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
    }

    .avatar-symbol {
      font-size: 2rem;
      color: var(--accent-light);
      font-weight: bold;
    }

    .name {
      font-size: 1.6rem;
      font-weight: 950;
      color: #FFF;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .title-role {
      font-size: 0.85rem;
      color: var(--accent-light);
      margin-bottom: 26px;
      font-style: italic;
      font-weight: 600;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .contact-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 24, 21, 0.8);
      border: 1px solid rgba(217, 119, 6, 0.3);
      color: var(--text);
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.88rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
    }

    .contact-btn:hover {
      background: var(--accent);
      color: #FFF;
      border-color: var(--accent-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(217, 119, 6, 0.5);
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-icon-circle {
      width: 32px;
      height: 32px;
      background: rgba(217, 119, 6, 0.15);
      border: 1px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .contact-btn:hover .btn-icon-circle {
      background: rgba(255, 255, 255, 0.2);
      border-color: #fff;
    }

    .arrow-icon {
      color: var(--accent);
      font-size: 1rem;
    }

    .contact-btn:hover .arrow-icon {
      color: #FFF;
      transform: translateX(-3px);
      transition: 0.2s;
    }

    .card-footer {
      font-size: 0.72rem;
      color: var(--muted);
      border-top: 1px dashed rgba(217, 119, 6, 0.3);
      padding-top: 14px;
      margin-top: 10px;
    }

    .card-footer strong {
      color: #FFF;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <div class="avatar-container">
      <span class="avatar-symbol">ف</span>
    </div>

    <div class="name">فهد الزهراني</div>
    <div class="title-role">رائد أعمال</div>

    <div class="links-list">
      <!-- 1. الاتصال المباشر -->
      <a href="tel:0569999699" class="contact-btn">
        <div class="btn-content">
          <div class="btn-icon-circle">📞</div>
          <span>اتصال مباشر</span>
        </div>
        <span class="arrow-icon">←</span>
      </a>

      <!-- 2. الواتساب -->
      <a href="https://wa.me/966569999699?text=مرحباً أستاذ فهد، تواصلت معك عبر بطاقتك الرقمية" target="_blank" class="contact-btn">
        <div class="btn-content">
          <div class="btn-icon-circle">💬</div>
          <span>محادثة واتساب</span>
        </div>
        <span class="arrow-icon">←</span>
      </a>

      <!-- 3. سناب شات (بدون رابط) -->
      <a href="#" onclick="return false;" class="contact-btn" style="opacity: 0.9;">
        <div class="btn-content">
          <div class="btn-icon-circle">👻</div>
          <span>سناب شات</span>
        </div>
        <span class="arrow-icon">←</span>
      </a>

      <!-- 4. منصة إكس (بدون رابط) -->
      <a href="#" onclick="return false;" class="contact-btn" style="opacity: 0.9;">
        <div class="btn-content">
          <div class="btn-icon-circle">🅧</div>
          <span>منصة إكس</span>
        </div>
        <span class="arrow-icon">←</span>
      </a>

      <!-- 5. البريد الإلكتروني -->
      <a href="mailto:fahad@example.com" class="contact-btn">
        <div class="btn-content">
          <div class="btn-icon-circle">✉️</div>
          <span>البريد الإلكتروني</span>
        </div>
        <span class="arrow-icon">←</span>
      </a>
    </div>

    <div class="card-footer">
      تصميم الهوية الرقمية: <strong>نبيل النمر</strong> © 2026
    </div>

  </div>

</body>
</html>
