<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فهد الزهراني | البطاقة الرقمية</title>
  <style>
    :root {
      --bg: #0B0A09;
      --card-bg: #14110F;
      --card-border: #D97706;
      --accent: #D97706;
      --accent-light: #FBBF24;
      --text: #F9FAFB;
      --muted: #9CA3AF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
    }

    /* حاوية الكارت مع حواف لامعة وفخمة فقط */
    .card-container {
      width: 100%;
      max-width: 410px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9),
                  0 0 15px rgba(217, 119, 6, 0.25); /* لمعة خفيفة وحصرية للحواف */
      position: relative;
    }

    .avatar-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 12px auto;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background-color: #1A1512;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-symbol {
      font-size: 1.8rem;
      color: var(--accent-light);
      font-weight: bold;
    }

    .name {
      font-size: 1.5rem;
      font-weight: 900;
      color: #FFF;
      margin-bottom: 4px;
    }

    .title-role {
      font-size: 0.82rem;
      color: var(--accent-light);
      margin-bottom: 24px;
      font-style: italic;
      font-weight: 600;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }

    .contact-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1E1815;
      border: 1px solid #332720;
      color: var(--text);
      text-decoration: none;
      padding: 13px 18px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.86rem;
      transition: all 0.25s ease;
    }

    .contact-btn:hover {
      background: var(--accent);
      color: #FFF;
      border-color: var(--accent-light);
      transform: translateY(-2px);
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* أيقونات التواصل على الطرف الأيسر من الزر */
    .btn-icon {
      font-size: 1.1rem;
    }

    .arrow-icon {
      color: var(--muted);
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .contact-btn:hover .arrow-icon {
      color: #FFF;
      transform: translateX(3px);
    }

    .card-footer {
      font-size: 0.72rem;
      color: var(--muted);
      border-top: 1px dashed rgba(217, 119, 6, 0.25);
      padding-top: 12px;
      margin-top: 10px;
    }

    .card-footer strong {
      color: #FFF;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <div class="avatar-container">
      <span class="avatar-symbol">ف</span>
    </div>

    <div class="name">فهد الزهراني</div>
    <div class="title-role">رائد أعمال</div>

    <div class="links-list">
      <!-- 1. الاتصال المباشر -->
      <a href="tel:0569999699" class="contact-btn">
        <div class="btn-content">
          <span class="arrow-icon">←</span>
          <span>اتصال مباشر</span>
        </div>
        <span class="btn-icon">📞</span>
      </a>

      <!-- 2. الواتساب -->
      <a href="https://wa.me/966569999699?text=مرحباً أستاذ فهد، تواصلت معك عبر بطاقتك الرقمية" target="_blank" class="contact-btn">
        <div class="btn-content">
          <span class="arrow-icon">←</span>
          <span>محادثة واتساب</span>
        </div>
        <span class="btn-icon">💬</span>
      </a>

      <!-- 3. سناب شات -->
      <a href="#" onclick="return false;" class="contact-btn" style="opacity: 0.9;">
        <div class="btn-content">
          <span class="arrow-icon">←</span>
          <span>سناب شات</span>
        </div>
        <span class="btn-icon">👻</span>
      </a>

      <!-- 4. منصة إكس -->
      <a href="#" onclick="return false;" class="contact-btn" style="opacity: 0.9;">
        <div class="btn-content">
          <span class="arrow-icon">←</span>
          <span>منصة إكس</span>
        </div>
        <span class="btn-icon">🅧</span>
      </a>

      <!-- 5. البريد الإلكتروني -->
      <a href="mailto:fahad@example.com" class="contact-btn">
        <div class="btn-content">
          <span class="arrow-icon">←</span>
          <span>البريد الإلكتروني</span>
        </div>
        <span class="btn-icon">✉️</span>
      </a>
    </div>

    <div class="card-footer">
      تصميم الهوية الرقمية: <strong>نبيل النمر</strong> © 2026
    </div>

  </div>

</body>
</html>
